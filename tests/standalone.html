// ---- src/db.js ----
const DB_NAME = 'achilles-return-db';
const DB_VERSION = 1;
let dbPromise;

function getDb() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('checkins')) db.createObjectStore('checkins', { keyPath:'id' });
        if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath:'id' });
        if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile', { keyPath:'id' });
        if (!db.objectStoreNames.contains('assessments')) db.createObjectStore('assessments', { keyPath:'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}

async function put(store, value) {
  const db = await getDb();
  if (!db) return;
  await txPromise(db, store, 'readwrite', s => s.put(value));
}

async function get(store, id) {
  const db = await getDb();
  if (!db) return null;
  return txPromise(db, store, 'readonly', s => s.get(id));
}

async function getAll(store) {
  const db = await getDb();
  if (!db) return [];
  return txPromise(db, store, 'readonly', s => s.getAll());
}

function txPromise(db, store, mode, op) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const request = op(tx.objectStore(store));
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    tx.onerror = () => reject(tx.error);
  });
}

async function exportAll() {
  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    profile: await getAll('profile'),
    checkins: await getAll('checkins'),
    sessions: await getAll('sessions'),
    assessments: await getAll('assessments')
  };
}

function usesOnlyOwnedEquipment(exercise) {
  return (exercise.equipment || []).every(item => OWNED_EQUIPMENT.includes(item));
}

function owned(items) {
  return items.filter(usesOnlyOwnedEquipment);
}

// ---- src/rules/readiness.js ----
const READINESS = Object.freeze({
  GREEN: 'GREEN',
  YELLOW_1: 'YELLOW_1',
  YELLOW_2: 'YELLOW_2',
  YELLOW_3: 'YELLOW_3',
  RED: 'RED'
});

const redSymptoms = new Set(['sharp-pain','new-bruising','major-swelling','sudden-weakness','new-limp','other-concerning']);

function classifyReadiness(checkIn) {
  const unusual = checkIn.unusualSymptoms || [];
  if (unusual.some(x => redSymptoms.has(x))) {
    return decision(READINESS.RED, 'A concerning symptom was reported.', 'Stop Achilles loading and seek appropriate medical evaluation.');
  }

  if (checkIn.pain === 'significant') {
    return decision(READINESS.YELLOW_3, 'Pain is substantially above a normal training response.', 'No impact loading today; use only tolerated low-load work.');
  }

  const severeTendonResponse = checkIn.pain === 'moderate' || checkIn.stiffness === 'much-more' || checkIn.swelling === 'a-lot' || checkIn.previousResponse === 'poor';
  if (severeTendonResponse) {
    return decision(READINESS.YELLOW_2, 'Your Achilles is showing a meaningful increase in symptoms.', 'Reduce Achilles loading and remove impact/high-rate work.');
  }

  const mildChange = checkIn.pain === 'mild' || checkIn.stiffness === 'slightly-more' || checkIn.swelling === 'a-little' || checkIn.previousResponse === 'somewhat-sore' || checkIn.recovery === 'poor';
  if (mildChange) {
    return decision(READINESS.YELLOW_1, 'Your Achilles or recovery is slightly below baseline.', 'Keep the session but reduce Achilles volume and do not progress loads.');
  }

  return decision(READINESS.GREEN, 'Your Achilles response looks stable today.', 'Complete the planned session.');
}

function decision(level, reason, action) {
  return { level, reason, action };
}

function readinessLabel(level) {
  return {
    GREEN: 'Ready to Train',
    YELLOW_1: 'Workout Adjusted',
    YELLOW_2: 'Workout Adjusted',
    YELLOW_3: 'Recovery Focus Today',
    RED: 'Stop Achilles Loading'
  }[level] || 'Check-In Needed';
}


// ---- src/rules/workout.js ----


function buildWorkout(readiness) {
  if (!readiness || readiness.level === READINESS.GREEN) return clone(BASE_WORKOUT);
  if (readiness.level === READINESS.RED) return { id:'red-stop', title:'No Achilles Workout', phase:'Safety Hold', items:[], stopped:true };
  if (readiness.level === READINESS.YELLOW_3) return clone(RECOVERY_WORKOUT);

  const workout = clone(BASE_WORKOUT);
  workout.title = 'Modified Achilles + Lower Body';
  workout.items = workout.items.map(item => {
    if (readiness.level === READINESS.YELLOW_1 && ['moderate','high'].includes(item.loadTier)) {
      return { ...item, sets: Math.max(2, item.sets - 1), adjustment: 'Reduced volume today' };
    }
    if (readiness.level === READINESS.YELLOW_2 && item.loadTier === 'high') {
      return null;
    }
    if (readiness.level === READINESS.YELLOW_2 && item.loadTier === 'moderate') {
      return { ...item, sets: Math.max(2, item.sets - 1), effort: 'Moderate', adjustment: 'Reduced Achilles demand today' };
    }
    return item;
  }).filter(Boolean);
  return workout;
}

function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

function resumeAfterMissedSessions(daysMissed, readinessLevel) {
  if (readinessLevel === READINESS.RED) return { action:'STOP', reduction:1 };
  if (daysMissed <= 3) return { action:'RESUME', reduction:0 };
  if (daysMissed <= 10) return { action:'REDUCED_REENTRY', reduction:0.2 };
  return { action:'RETEST_AND_REENTER', reduction:0.3 };
}

function startOfWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d;
}

function dateKey(d) {
  const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

  state.sessions = await getAll('sessions');

function renderCalendar() {
  const cursor = state.calendarCursor;
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y,m,1);

  const days = new Date(y,m+1,0).getDate();
  const sessionDates = new Set(state.sessions.map(s=>s.date));
  const cells = [];
  for(let i=0;i<offset;i++) cells.push('<div class="calendar-day blank"></div>');
  for(let d=1;d<=days;d++){
    const date = new Date(y,m,d); const key=dateKey(date);
    const classes=['calendar-day'];
    if(key===dayKey()) classes.push('today');
    if(sessionDates.has(key)) classes.push('has-session');
    if(state.selectedHistoryDate===key) classes.push('selected');
    cells.push(`<button class="${classes.join(' ')}" data-calendar-date="${key}">${d}</button>`);
  }
  return `<section class="calendar-card">
    <div class="calendar-head"><h3>${cursor.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><div class="calendar-nav"><button data-calendar-shift="-1" aria-label="Previous month">‹</button><button data-calendar-shift="1" aria-label="Next month">›</button></div></div>

  return `<div class="history-session"><div class="history-session-head"><div><strong>${title}</strong><br><small>${historyStatusLabel(session.status)}</small></div><small>${session.overallDifficulty ? 'Difficulty: '+session.overallDifficulty.replace('-', ' ') : ''}</small></div>${entries.length ? entries.map(([id,log])=>{
    const ex=findExerciseById(id); const sets=(log.sets||[]).filter(x=>x.complete||x.load||x.reps); const summary=sets.map(x=>`${x.load?x.load+' lb × ':''}${x.reps||'—'}`).join(' · ');
    return `<div class="history-exercise"><strong>${ex?.name || id}</strong><small>${summary || 'Logged'}</small></div>`;
  }).join('') : '<div class="empty-history">No set details were saved.</div>'}</div>`;
}

function findExerciseById(id) { return Object.values(exercises).find(x=>x.id===id); }
function workoutTitleFromId(id) { if(id===BASE_WORKOUT.id) return BASE_WORKOUT.title; if(id===RECOVERY_WORKOUT.id) return RECOVERY_WORKOUT.title; return 'Workout'; }
function historyStatusLabel(status) { return ({TOLERATED:'Tolerated ✓',BORDERLINE:'Borderline response',NOT_TOLERATED:'Not tolerated',PENDING_NEXT_DAY_RESPONSE:'Waiting for next-morning response'})[status] || status || 'Completed'; }

function renderProgress() {
  const stages = ['Strength','Running Readiness','Running','Jumping','Plyometrics','Speed','Change of Direction','Basketball'];
  return `
    <section class="hero-card"><span class="pill">Current stage</span><h2>Re-entry / Baseline</h2><p>We need your objective baseline before assigning a later stage.</p></section>
    <section class="stage-list">${stages.map((s,i)=>`<div class="stage ${i===0?'current':'locked'}"><span>${i===0?'●':'○'}</span><div><strong>${s}</strong><small>${i===0?'Building foundation':'Locked until criteria are met'}</small></div></div>`).join('')}</section>
    <section class="milestone-card"><div><div class="eyebrow">Next milestone</div><h3>Baseline testing</h3><p>Heel-rise capacity, balance and ankle mobility establish your starting point.</p></div><button class="secondary" data-tab="tests">View Tests</button></section>
  `;
}

function renderTests() {
  return `
    <section class="hero-card"><span class="pill">Due now</span><h2>Baseline Assessment</h2><p>Complete these in short sessions rather than one exhausting test day.</p></section>
    <div class="test-list">
      ${testRow('Symptoms & function','5 min','Ready')}
      ${testRow('Knee-to-wall mobility','5 min','Ready')}
      ${testRow('Single-leg balance','5 min','Ready')}
      ${testRow('Heel-rise assessment','10 min','Ready')}
      ${testRow('Loaded calf capacity','10 min','Ready')}
      ${testRow('Running readiness','Later','Locked',true)}
      ${testRow('Jump & landing','Later','Locked',true)}
    </div>
    <div class="info-card"><strong>Why are later tests locked?</strong><p>The app avoids testing high-load activities before prerequisite strength and symptom criteria are established.</p></div>
  `;
}

function testRow(name,time,status,locked=false){ return `<div class="test-row"><div><strong>${name}</strong><small>${time}</small></div><span class="${locked?'lock':'ready-tag'}">${locked?'🔒 ':''}${status}</span></div>`; }

function renderMore() {
  return `
    <section class="settings-card">
      <div class="setting-row"><span>Surgery date</span><strong>January 7, 2026</strong></div>
      <div class="setting-row"><span>Current stage</span><strong>Re-entry / Baseline</strong></div>
      <div class="setting-row"><span>Ruleset</span><strong>v1.3</strong></div>
    </section>
    <section class="settings-card">
      <div class="eyebrow">Home gym equipment</div>
      <h3 class="equipment-title">Workout equipment whitelist</h3>
      <div class="equipment-chips">${OWNED_EQUIPMENT.map(e => `<span>${equipmentLabel(e)}</span>`).join('')}</div>
      <p class="equipment-note">Workouts are filtered to this equipment list. A standalone leg press is not used.</p>
    </section>
    <div class="menu-list">
      <button data-tab="plan">Plan & Workout Calendar <span>›</span></button>
      <button data-action="export">Export My Data <span>↓</span></button>
      <button data-action="about">Evidence & Safety <span>›</span></button>
    </div>
    <div class="info-card"><strong>Local-first privacy</strong><p>Your rehab information is stored in this browser on this device. Export a backup periodically.</p></div>
    <p class="disclaimer">This app supports rehabilitation tracking and exercise progression. It does not diagnose injury or replace individualized medical care.</p>
  `;
}

function equipmentLabel(id) {
  return ({
    'smith-machine':'Smith machine',
    'adjustable-bench':'Adjustable bench',
    'cable-machine':'Cable machine',
    'belt-squat':'Belt squat',
    'trap-bar':'Trap / hex bar',
    'dumbbells':'Dumbbells',
    'pull-up-bar':'Pull-up bar',
    'dip-bars':'Dip bars',
    'exercise-bike':'Exercise bike',
    'incline-treadmill':'Incline treadmill',
    'slant-board':'Slant board',
    'balance-pad':'Balance pad',
    'rehab-bands':'Rehab bands',
    'weighted-wagon':'Weighted wagon / sled'
  })[id] || id;
}

function renderNav() {
  if (state.showCheckin || state.showWorkout || state.showExerciseDetail || state.showFinish) return '';
  return `<nav class="bottom-nav">${[['today','Today'],['plan','Plan'],['progress','Progress'],['tests','Tests'],['more','More']].map(([id,label])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}"><span>${navIcon(id)}</span>${label}</button>`).join('')}</nav>`;
}

function navIcon(id) { return ({today:'⌂',plan:'▦',progress:'↗',tests:'✓',more:'•••'})[id]; }

function bindEvents() {
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; clearFlows(); render(); });
  const action = (name, fn) => { const el=app.querySelector(`[data-action="${name}"]`); if(el) el.onclick=fn; };
  action('checkin',()=>{state.showCheckin=true;render();});
  action('close-flow',()=>{state.showCheckin=false;render();});
  action('start-workout',()=>{state.showWorkout=true;render();});
  action('close-workout',()=>{state.showWorkout=false;render();});
  action('finish-workout',()=>{state.showWorkout=false;state.showFinish=true;render();});
  action('back-workout',()=>{state.showExerciseDetail=null;state.showFinish=false;state.showWorkout=true;render();});
  app.querySelectorAll('[data-action="exercise-detail"]').forEach(b=>b.onclick=()=>{state.showWorkout=false;state.showExerciseDetail=b.dataset.id;render();});
  app.querySelectorAll('[data-log-field]').forEach(input=>input.oninput=()=>updateSetLog(input));
  app.querySelectorAll('[data-set-complete]').forEach(button=>button.onclick=()=>toggleSetComplete(button));
  app.querySelectorAll('[data-plan-date]').forEach(button=>button.onclick=()=>{ state.planDetailDate = state.planDetailDate === button.dataset.planDate ? null : button.dataset.planDate; render(); });
  app.querySelectorAll('[data-calendar-date]').forEach(button=>button.onclick=()=>{ state.selectedHistoryDate=button.dataset.calendarDate; render(); });
  app.querySelectorAll('[data-calendar-shift]').forEach(button=>button.onclick=()=>{ const shift=Number(button.dataset.calendarShift); state.calendarCursor=new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth()+shift, 1); state.selectedHistoryDate=null; render(); });
  const form = app.querySelector('#checkin-form'); if(form) form.onsubmit=submitCheckin;
  const finish = app.querySelector('#finish-form'); if(finish) finish.onsubmit=submitFinish;
  action('export', exportData);
  action('history', showHistory);
  action('about', showAbout);
  action('info', showAbout);
}

function ensureSetLog(exerciseId, setIndex) {
  state.workoutLog[exerciseId] ||= { sets: [] };
  state.workoutLog[exerciseId].sets ||= [];
  state.workoutLog[exerciseId].sets[setIndex] ||= {};
  return state.workoutLog[exerciseId].sets[setIndex];
}

function updateSetLog(input) {
  const setLog = ensureSetLog(input.dataset.exercise, Number(input.dataset.set));
  setLog[input.dataset.logField] = input.value;
}

function toggleSetComplete(button) {
  const setLog = ensureSetLog(button.dataset.exercise, Number(button.dataset.set));
  setLog.complete = !setLog.complete;
  render();
}

async function submitCheckin(e) {
  e.preventDefault(); const fd=new FormData(e.target);
  const answers={ pain:fd.get('pain'), stiffness:fd.get('stiffness'), swelling:fd.get('swelling'), previousResponse:fd.get('previousResponse'), recovery:fd.get('recovery'), unusualSymptoms:fd.getAll('unusual') };
  const readiness=classifyReadiness(answers);
  state.checkIn=answers; state.readiness=readiness; state.workout=buildWorkout(readiness); state.showCheckin=false;
  await put('checkins',{id:dayKey(),date:dayKey(),createdAt:new Date().toISOString(),answers,readiness});
  await closePreviousPendingSession(answers.previousResponse);
  render();
}

async function submitFinish(e) {
  e.preventDefault(); const fd=new FormData(e.target);
  const session={ id:`${dayKey()}-${Date.now()}`, date:dayKey(), createdAt:new Date().toISOString(), workoutId:state.workout.id, workoutTitle:state.workout.title, readiness:state.readiness, exerciseLog:state.workoutLog, overallDifficulty:fd.get('difficulty'), immediateAchillesResponse:fd.get('achilles'), notes:fd.get('notes')||'', status:'PENDING_NEXT_DAY_RESPONSE' };
  await put('sessions',session);
  state.sessions = await getAll('sessions');
  state.showFinish=false; state.workoutLog={}; state.currentExercise=0; render();
  toast('Workout saved. Tomorrow’s check-in will confirm how the Achilles tolerated it.');
}


async function closePreviousPendingSession(previousResponse) {
  const sessions = await getAll('sessions');
  const pending = sessions
    .filter(s => s.status === 'PENDING_NEXT_DAY_RESPONSE' && s.date < dayKey())
    .sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0];
  if (!pending) return;
  const statusMap = { good:'TOLERATED', 'somewhat-sore':'BORDERLINE', poor:'NOT_TOLERATED' };
  pending.status = statusMap[previousResponse] || 'PENDING_NEXT_DAY_RESPONSE';
  pending.nextDayResponse = previousResponse;
  pending.closedAt = new Date().toISOString();
  await put('sessions', pending);
  state.sessions = await getAll('sessions');
}

async function exportData() {
  const payload=await exportAll(); const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`achilles-rehab-backup-${dayKey()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function showHistory() { state.tab='plan'; clearFlows(); render(); }
function showAbout(){ alert('Achilles Return v0.1\n\nRule-based rehabilitation support. Red-flag symptoms override workout progression. The app does not replace individualized medical care.'); }
function clearFlows(){ state.showCheckin=false;state.showWorkout=false;state.showExerciseDetail=null;state.showFinish=false; }
function dayKey(){ const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function toast(msg){ const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),4200); }

function registerPwa(){ if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }

</script>
</body>
</html>
